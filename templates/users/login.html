{% extends "layout.html" %}
{% import 'bootstrap_wtf.html' as wtf %}
{% block title %}
    Login
{% endblock %}

{% block main %}
    <h1>Log In</h1>

    <div class="container border border-dark rounded mb-4 p-2 constrain-sm">
        <div class="row mb">
            <div id="login-form" class="col">
                {{ wtf.quick_form(formLogin) }}
                
            </div>
        </div>
        <div class="row mb">
            <div class="col">
                {{ wtf.quick_form(formRegister) }}
            </div>
        </div>
        <div class="row mb">
            <div class="col">
                {{ wtf.quick_form(formChange) }}
            </div>
        </div>
    </div>

{% endblock %}
